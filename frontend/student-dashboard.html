<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FMS — Student Dashboard</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#30205b,#090912 55%);color:white}.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.13)}</style></head><body class="min-h-screen p-5 md:p-8"><header class="glass rounded-2xl p-5 flex items-center justify-between"><div><p class="text-violet-300 text-sm">Student Portal</p><h1 class="text-2xl font-bold">Welcome, <span id="name">Student</span></h1><p id="email" class="text-white/50 text-sm mt-1"></p></div><button onclick="logout()" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15">Logout</button></header><main class="grid md:grid-cols-3 gap-4 mt-5"><div class="glass rounded-2xl p-6"><div class="text-3xl">📚</div><h2 class="font-semibold mt-3">My Classes</h2><p class="text-white/50 text-sm mt-1">View your academic classes and subjects.</p></div><div class="glass rounded-2xl p-6"><div class="text-3xl">📅</div><h2 class="font-semibold mt-3">Schedule</h2><p class="text-white/50 text-sm mt-1">Check your lecture schedule.</p></div><div class="glass rounded-2xl p-6"><div class="text-3xl">📢</div><h2 class="font-semibold mt-3">Announcements</h2><p class="text-white/50 text-sm mt-1">Stay updated with college notices.</p></div></main><script>const u=JSON.parse(localStorage.getItem('user')||'{}');const token=localStorage.getItem('fms_access_token');if(!token)location.href='/login.html';document.getElementById('name').textContent=u.fullName||'Student';document.getElementById('email').textContent=u.email||'';function logout(){localStorage.removeItem('fms_access_token');localStorage.removeItem('user');location.href='/login.html'}</script></body></html>
