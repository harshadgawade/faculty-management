<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FMS — Demo Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#fff;background:#07070d;overflow:hidden}
body:before,body:after{content:"";position:fixed;border-radius:999px;filter:blur(90px);pointer-events:none;z-index:-1;opacity:.45}body:before{width:430px;height:430px;background:#7c3aed;top:-170px;left:-120px}body:after{width:380px;height:380px;background:#2563eb;right:-130px;bottom:-140px}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 0,rgba(124,58,237,.2),transparent 38%),linear-gradient(135deg,#0b0913,#07070d 55%,#0a0b14)}
.grid{position:fixed;inset:0;z-index:-1;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:42px 42px}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.045));backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.15);box-shadow:0 35px 100px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.13)}
.logo{background:linear-gradient(135deg,#a78bfa,#7c3aed 55%,#4c1d95);box-shadow:0 18px 45px rgba(124,58,237,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.input{width:100%;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);color:white;transition:.2s}.input::placeholder{color:rgba(255,255,255,.3)}.input:focus{outline:none;border-color:#a78bfa;box-shadow:0 0 0 4px rgba(139,92,246,.12)}
.btn{background:linear-gradient(135deg,#a78bfa,#7c3aed 55%,#5b21b6);box-shadow:0 14px 32px rgba(124,58,237,.3),inset 0 1px 0 rgba(255,255,255,.3);transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn:active{transform:none}
.role{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);transition:.2s}.role:hover,.role.active{border-color:#a78bfa;background:rgba(139,92,246,.13);box-shadow:0 0 0 2px rgba(139,92,246,.08)}
.otp{width:46px;height:54px;text-align:center;font-size:21px;font-weight:800;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);border-radius:12px;color:#fff}.otp:focus{outline:none;border-color:#a78bfa;box-shadow:0 0 0 4px rgba(139,92,246,.12)}
.msg{display:none}.msg.show{display:block}.success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:#6ee7b7}.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5}
.hide{display:none!important}@media(max-width:480px){main{padding:22px!important}.otp{width:42px;height:50px}.otp-row{gap:6px}}
</style>
</head>
<body class="flex items-center justify-center p-4">
<div class="bg"></div><div class="grid"></div>
<main class="glass w-full max-w-md rounded-[28px] p-7 sm:p-8">
  <div class="text-center">
    <div class="logo mx-auto w-16 h-16 rounded-[19px] grid place-items-center text-3xl mb-4">🎓</div>
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-violet-500/10 border border-violet-400/20 text-[10px] uppercase tracking-[.18em] text-violet-200 mb-3"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Demo Portal</div>
    <h1 class="text-2xl sm:text-[27px] font-extrabold tracking-tight">Faculty Management System</h1>
    <p class="text-white/45 text-sm mt-2">Demo login — no backend or OTP API required</p>
  </div>

  <div id="message" class="msg rounded-2xl p-3.5 text-sm mt-6"></div>

  <section id="loginBox" class="mt-6">
    <label class="text-xs font-semibold text-white/55 uppercase tracking-wider">Login as</label>
    <div class="grid grid-cols-3 gap-2 mt-2 mb-5">
      <button class="role active rounded-2xl p-3 text-center" data-role="student"><div class="text-2xl">🎓</div><div class="text-xs font-semibold mt-1">Student</div></button>
      <button class="role rounded-2xl p-3 text-center" data-role="teacher"><div class="text-2xl">👨‍🏫</div><div class="text-xs font-semibold mt-1">Teacher</div></button>
      <button class="role rounded-2xl p-3 text-center" data-role="faculty"><div class="text-2xl">🧑‍💼</div><div class="text-xs font-semibold mt-1">Faculty</div></button>
    </div>

    <label class="text-xs font-semibold text-white/55">Demo Login ID</label>
    <div class="relative mt-2"><span class="absolute left-4 top-1/2 -translate-y-1/2 text-white/30">✉</span><input id="email" class="input rounded-2xl pl-11 pr-4 py-3.5 text-sm" type="email" value="student@university.edu" autocomplete="username" placeholder="student@university.edu"></div>
    <p class="text-[11px] text-white/30 mt-2">Use any demo ID ending with <b class="text-violet-300">@university.edu</b>.</p>
    <button id="sendOtp" class="btn w-full rounded-2xl py-3.5 mt-4 font-semibold text-sm">Send Demo OTP <span class="ml-1">→</span></button>
  </section>

  <section id="otpBox" class="hide mt-6">
    <div class="text-center"><span class="text-xs text-white/40">Demo OTP for</span><div id="showEmail" class="text-sm font-semibold text-violet-300 mt-1 break-all"></div></div>
    <div class="flex justify-center gap-2 my-6 otp-row">
      <input class="otp" maxlength="1" inputmode="numeric" autocomplete="one-time-code"><input class="otp" maxlength="1" inputmode="numeric"><input class="otp" maxlength="1" inputmode="numeric"><input class="otp" maxlength="1" inputmode="numeric"><input class="otp" maxlength="1" inputmode="numeric"><input class="otp" maxlength="1" inputmode="numeric">
    </div>
    <div class="text-center text-xs text-white/35 mb-4">Demo OTP: <b class="text-violet-300 tracking-[.2em]">123456</b></div>
    <button id="login" class="btn w-full rounded-2xl py-3.5 font-semibold text-sm">Verify &amp; Login</button>
    <button id="back" class="w-full text-xs text-white/40 hover:text-white/70 mt-4">← Change Login ID</button>
  </section>

  <div class="mt-6 pt-5 border-t border-white/10 text-center">
    <p class="text-[11px] text-white/25">🔒 Demo mode • API calls disabled</p>
  </div>
</main>
<script>
const DEMO_OTP='123456';
let role='student';
const $=id=>document.getElementById(id);
const email=$('email'), message=$('message'), loginBox=$('loginBox'), otpBox=$('otpBox'), showEmail=$('showEmail');
const otpInputs=[...document.querySelectorAll('.otp')];
function msg(text,ok=false){message.textContent=text;message.className='msg show rounded-2xl p-3.5 text-sm '+(ok?'success':'error')}
function validEmail(v){return /^[^\s@]+@university\.edu$/i.test(v)}
function fillRole(r){role=r;email.value=r+'@university.edu';document.querySelectorAll('.role').forEach(x=>x.classList.toggle('active',x.dataset.role===r));}
document.querySelectorAll('.role').forEach(b=>b.addEventListener('click',()=>fillRole(b.dataset.role)));
$('sendOtp').addEventListener('click',()=>{const v=email.value.trim().toLowerCase();if(!validEmail(v)){msg('Please use a valid demo login ID ending with @university.edu');return}showEmail.textContent=v;loginBox.classList.add('hide');otpBox.classList.remove('hide');message.className='msg';otpInputs.forEach(x=>x.value='');otpInputs[0].focus()});
$('back').addEventListener('click',()=>{otpBox.classList.add('hide');loginBox.classList.remove('hide');message.className='msg';email.focus()});
otpInputs.forEach((input,i)=>{input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(-1);if(input.value&&i<5)otpInputs[i+1].focus()});input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!input.value&&i>0)otpInputs[i-1].focus();if(e.key==='ArrowLeft'&&i>0)otpInputs[i-1].focus();if(e.key==='ArrowRight'&&i<5)otpInputs[i+1].focus();if(e.key==='Enter')$('login').click()});input.addEventListener('paste',e=>{e.preventDefault();const text=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);text.split('').forEach((n,j)=>{if(otpInputs[j])otpInputs[j].value=n});otpInputs[Math.min(text.length,5)].focus()})});
$('login').addEventListener('click',()=>{const entered=otpInputs.map(x=>x.value).join('');if(entered!==DEMO_OTP){msg('Wrong OTP. For demo login, use 123456.');return}const user={name:role.charAt(0).toUpperCase()+role.slice(1)+' Demo User',email:email.value.trim().toLowerCase(),role};localStorage.setItem('fms_demo_login','true');localStorage.setItem('fms_access_token','demo-token');localStorage.setItem('user',JSON.stringify(user));msg('Demo login successful! Welcome, '+user.name+'.',true);$('login').disabled=true;$('login').textContent='✓ Logged In';});
email.addEventListener('keydown',e=>{if(e.key==='Enter')$('sendOtp').click()});
</script>
</body>
</html>
