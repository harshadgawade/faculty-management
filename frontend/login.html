<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FMS — Sign In / Sign Up</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#30205b,#090912 55%);color:white}.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.13)}.inp{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:white}.inp:focus{outline:0;border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf633}.btn{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}.hiddenx{display:none}.otp{width:44px;height:52px;text-align:center;font-size:22px;font-weight:700;background:#ffffff0b;border:1px solid #ffffff24;border-radius:10px;color:white}.role-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);transition:.2s}.role-card.active{border-color:#8b5cf6;background:rgba(139,92,246,.16);box-shadow:0 0 0 2px #8b5cf622}.role-card:hover{border-color:#8b5cf6aa}</style></head><body class="min-h-screen flex items-center justify-center p-4"><main class="glass w-full max-w-md rounded-3xl p-7 shadow-2xl"><div class="text-center mb-6"><div class="mx-auto w-16 h-16 rounded-2xl btn grid place-items-center text-3xl mb-3">🎓</div><h1 class="text-2xl font-bold">Faculty Management System</h1><p class="text-white/50 text-sm mt-1">Secure institutional access</p></div><div class="flex bg-white/5 rounded-xl p-1 mb-5"><button id="signInTab" class="w-1/2 py-2 rounded-lg bg-white/10 font-semibold">Sign In</button><button id="signUpTab" class="w-1/2 py-2 rounded-lg text-white/60">Sign Up</button></div><div id="msg" class="hidden mb-4 p-3 rounded-xl text-sm"></div><section id="signin"><label class="text-xs text-white/60">Login as</label><div class="grid grid-cols-3 gap-2 mt-2 mb-5"><button type="button" class="role-card active rounded-xl p-3 text-center" data-role="student"><div class="text-2xl">🎓</div><div class="text-xs font-semibold mt-1">Student</div></button><button type="button" class="role-card rounded-xl p-3 text-center" data-role="teacher"><div class="text-2xl">👨‍🏫</div><div class="text-xs font-semibold mt-1">Teacher</div></button><button type="button" class="role-card rounded-xl p-3 text-center" data-role="faculty"><div class="text-2xl">🧑‍💼</div><div class="text-xs font-semibold mt-1">Faculty</div></button></div><div id="emailStep"><label class="text-xs text-white/60">Institutional Email</label><input id="loginEmail" class="inp w-full rounded-xl px-4 py-3 mt-2" type="email" placeholder="you@university.edu"><button id="send" class="btn w-full rounded-xl py-3 mt-4 font-semibold">Send OTP</button><p class="text-center text-xs text-white/30 mt-4">Only @university.edu and @college.ac.in emails are accepted.</p></div><div id="otpStep" class="hiddenx"><p class="text-sm text-white/60 text-center">OTP sent to <b id="otpEmail" class="text-violet-300"></b></p><div class="flex justify-center gap-2 my-6"><input id="o0" class="otp" maxlength="1" inputmode="numeric"><input id="o1" class="otp" maxlength="1" inputmode="numeric"><input id="o2" class="otp" maxlength="1" inputmode="numeric"><input id="o3" class="otp" maxlength="1" inputmode="numeric"><input id="o4" class="otp" maxlength="1" inputmode="numeric"><input id="o5" class="otp" maxlength="1" inputmode="numeric"></div><button id="verify" class="btn w-full rounded-xl py-3 font-semibold">Verify & Login</button><div class="flex justify-center gap-4 mt-4 text-xs"><button id="resend" class="text-violet-300">Resend OTP</button><button id="change" class="text-white/50">Change email</button></div></div></section><section id="signup" class="hiddenx"><label class="text-xs text-white/60">Create account as</label><div class="grid grid-cols-3 gap-2 mt-2 mb-4"><button type="button" class="role-card active rounded-xl p-2 text-center" data-signup-role="student"><div class="text-xl">🎓</div><div class="text-xs font-semibold">Student</div></button><button type="button" class="role-card rounded-xl p-2 text-center" data-signup-role="teacher"><div class="text-xl">👨‍🏫</div><div class="text-xs font-semibold">Teacher</div></button><button type="button" class="role-card rounded-xl p-2 text-center" data-signup-role="faculty"><div class="text-xl">🧑‍💼</div><div class="text-xs font-semibold">Faculty</div></button></div><div class="grid grid-cols-2 gap-3"><input id="first" class="inp rounded-xl px-3 py-3" placeholder="First name"><input id="last" class="inp rounded-xl px-3 py-3" placeholder="Last name"></div><input id="newEmail" class="inp w-full rounded-xl px-4 py-3 mt-3" type="email" placeholder="you@university.edu"><select id="dept" class="inp w-full rounded-xl px-4 py-3 mt-3"><option value="">Loading departments...</option></select><button id="create" class="btn w-full rounded-xl py-3 mt-4 font-semibold">Create Student Account</button><p class="text-xs text-white/35 text-center mt-4">Select your field, create the account, then sign in with the same field and OTP.</p></section><p class="text-center text-xs text-white/25 border-t border-white/10 pt-5 mt-6">Need help? Contact your institution IT Help Desk.</p></main><script>
const API='/api',DIRECT_API='https://fms-backend.onrender.com/api',DOMAIN=/(@university\.edu|@college\.ac\.in)$/i;let currentEmail='',selectedRole='student',signupRole='student';const $=id=>document.getElementById(id);function message(t,ok=false){$('msg').textContent=t;$('msg').className='mb-4 p-3 rounded-xl text-sm '+(ok?'bg-emerald-500/10 border border-emerald-500/20 text-emerald-300':'bg-red-500/10 border border-red-500/20 text-red-300')}
async function req(path,opt={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const type=r.headers.get('content-type')||'';const d=type.includes('json')?await r.json():await r.text();if(!r.ok)throw Error(d.detail||d.message||d.error||'Request failed');return d}
function tabs(signin){$('signin').classList.toggle('hiddenx',!signin);$('signup').classList.toggle('hiddenx',signin);$('signInTab').className='w-1/2 py-2 rounded-lg '+(signin?'bg-white/10 font-semibold':'text-white/60');$('signUpTab').className='w-1/2 py-2 rounded-lg '+(!signin?'bg-white/10 font-semibold':'text-white/60');$('msg').classList.add('hidden')}
$('signInTab').onclick=()=>tabs(true);$('signUpTab').onclick=()=>{tabs(false);loadDepartments()};document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{selectedRole=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x===b));});document.querySelectorAll('[data-signup-role]').forEach(b=>b.onclick=()=>{signupRole=b.dataset.signupRole;document.querySelectorAll('[data-signup-role]').forEach(x=>x.classList.toggle('active',x===b));$('create').textContent='Create '+signupRole.charAt(0).toUpperCase()+signupRole.slice(1)+' Account';});
async function loadDepartments(){const select=$('dept');select.innerHTML='<option value="">Loading departments...</option>';try{let ds;try{ds=await req('/departments')}catch(proxyError){const r=await fetch(DIRECT_API+'/departments',{headers:{Accept:'application/json'}});const type=r.headers.get('content-type')||'';const d=type.includes('json')?await r.json():await r.text();if(!r.ok)throw Error(d.detail||d.message||d.error||'Departments unavailable');ds=d}if(!Array.isArray(ds)||ds.length===0)throw Error('No departments configured.');select.innerHTML='<option value="">Select department</option>'+ds.map(d=>`<option value="${d.id}">${d.code} — ${d.name}</option>`).join('');$('msg').classList.add('hidden')}catch(e){select.innerHTML='<option value="">Departments unavailable — retry</option>';message('Departments could not be loaded. Please try again.')}}
$('dept').onclick=()=>{if($('dept').options.length<=1)loadDepartments()};$('dept').onfocus=()=>{if($('dept').options.length<=1)loadDepartments()};
$('send').onclick=async()=>{const email=$('loginEmail').value.trim().toLowerCase();if(!DOMAIN.test(email))return message('Use @university.edu or @college.ac.in email.');$('send').disabled=true;try{await req('/auth/send-otp',{method:'POST',body:JSON.stringify({email})});currentEmail=email;$('otpEmail').textContent=email;$('emailStep').classList.add('hiddenx');$('otpStep').classList.remove('hiddenx');$('o0').focus();message('OTP sent successfully.',true)}catch(e){message(e.message)}finally{$('send').disabled=false}};
function otp(){return [0,1,2,3,4,5].map(i=>$('o'+i).value).join('')}[0,1,2,3,4,5].forEach(i=>$('o'+i).oninput=()=>{if($('o'+i).value&&i<5)$('o'+(i+1)).focus()});$('verify').onclick=async()=>{const code=otp();if(code.length!==6)return message('Enter the 6-digit OTP.');try{const d=await req('/auth/verify-otp',{method:'POST',body:JSON.stringify({email:currentEmail,otp:code})});const actual=String(d.role||'').toLowerCase();const match=selectedRole==='student'?actual.includes('student'):selectedRole==='teacher'?actual.includes('teacher'):actual.includes('faculty')||actual.includes('hod')||actual.includes('dean')||actual.includes('admin');if(!match)return message('This account is registered as '+(d.role||'another role')+', not '+selectedRole+'. Please select the correct login type.');localStorage.setItem('fms_access_token',d.accessToken);localStorage.setItem('user',JSON.stringify(d));location.href=selectedRole==='student'?'/student-dashboard.html':'/dashboard.html'}catch(e){message(e.message)}};$('resend').onclick=()=>{$('send').click()};$('change').onclick=()=>{$('otpStep').classList.add('hiddenx');$('emailStep').classList.remove('hiddenx');$('loginEmail').focus()};$('create').onclick=async()=>{const data={firstName:$('first').value.trim(),lastName:$('last').value.trim(),email:$('newEmail').value.trim().toLowerCase(),departmentId:Number($('dept').value),role:signupRole};if(!data.firstName||!data.lastName||!DOMAIN.test(data.email)||!data.departmentId||!data.role)return message('Enter name, valid institutional email, department and account type.');$('create').disabled=true;try{const d=await req('/auth/signup',{method:'POST',body:JSON.stringify(data)});$('loginEmail').value=data.email;selectedRole=signupRole;document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x.dataset.role===selectedRole));tabs(true);message(d.message||'Account created. Now sign in with the same account type to receive your OTP.',true)}catch(e){message(e.message)}finally{$('create').disabled=false}};
</script></body></html>
