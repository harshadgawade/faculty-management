<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FMS — Faculty Management System</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#0b0b15;--panel:#151522;--line:#2b2b3c;--text:#f5f3ff;--muted:#9b9aad;--p:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#17132b 0,#0b0b15 38%);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}#side{position:fixed;left:0;top:0;bottom:0;width:260px;background:rgba(15,15,29,.97);border-right:1px solid var(--line);z-index:20;display:flex;flex-direction:column;transition:.25s}.brand{padding:22px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#5b21b6);display:grid;place-items:center;font-size:20px}.brand small,.profile small,.notice small,.task small,.list-row small{display:block;color:var(--muted);margin-top:4px}.nav-group{color:#626174;font-size:11px;font-weight:700;letter-spacing:.14em;padding:18px 18px 7px}.nav{display:flex;align-items:center;gap:12px;width:calc(100% - 24px);margin:2px 12px;padding:11px 13px;border:0;border-radius:11px;background:transparent;color:#aaa8b7;text-align:left}.nav:hover,.nav.active{background:linear-gradient(135deg,rgba(139,92,246,.32),rgba(99,102,241,.18));color:white}.nav i{font-style:normal;width:20px;text-align:center}.nav-badge{margin-left:auto;background:#7c3aed;color:white;border-radius:999px;padding:2px 7px;font-size:11px}.profile{margin-top:auto;padding:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#a78bfa,#7c3aed);font-weight:800}.profile>div:nth-child(2){flex:1}.profile button{background:none;border:0;color:#aaa;font-size:20px}#main{margin-left:260px;min-height:100vh}header{height:68px;position:sticky;top:0;z-index:10;background:rgba(11,11,21,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:18px}.icon{background:transparent;border:0;color:#aaa;font-size:20px}.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px}.search{width:230px;background:#171724;border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:white;outline:none}.page{padding:30px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.page-head h2{font-size:24px;margin:0 0 6px}.page-head p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#202031;color:#eee;padding:9px 13px;border-radius:9px}.btn:hover{filter:brightness(1.15)}.btn.primary{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:#8b5cf6}.btn.success{background:rgba(16,185,129,.18);color:#5eead4;border-color:rgba(16,185,129,.35)}.btn.danger,.danger{background:rgba(239,68,68,.13);color:#fca5a5;border-color:rgba(239,68,68,.3)}.btn.warn{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.3)}.btn.small{padding:6px 9px;font-size:12px}.banner{padding:22px;border:1px solid rgba(139,92,246,.35);border-radius:18px;background:linear-gradient(135deg,rgba(139,92,246,.16),rgba(99,102,241,.06));display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}.banner b{font-size:18px}.banner p{color:var(--muted);margin:6px 0 0}.grid{display:grid;gap:18px;margin-bottom:18px}.grid.four{grid-template-columns:repeat(4,1fr)}.grid.three{grid-template-columns:repeat(3,1fr)}.grid.two{grid-template-columns:repeat(2,1fr)}.card{background:rgba(21,21,34,.9);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.14)}.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.card-title span{color:var(--muted);font-size:12px}.kpi small{color:var(--muted)}.kpi strong{display:block;font-size:28px;margin:8px 0}.kpi span{color:#aaa;font-size:12px}.toolbar{display:flex;gap:10px;margin-bottom:15px}.input{width:100%;background:#11111d;border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:white;outline:none}.toolbar .input{max-width:340px}.table-wrap{overflow:auto}.table-wrap table{width:100%;border-collapse:collapse}.table-wrap th{color:#858294;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:11px;border-bottom:1px solid var(--line)}.table-wrap td{padding:12px 11px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}.table-wrap tr:hover td{background:rgba(255,255,255,.025)}td small{display:block;color:var(--muted);margin-top:3px}.code{color:#c4b5fd}.status{display:inline-block;background:rgba(16,185,129,.13);color:#6ee7b7;border:1px solid rgba(16,185,129,.25);padding:3px 8px;border-radius:999px;font-size:11px}.notice,.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06)}.notice:last-child,.list-row:last-child{border:0}.notice p{color:#bbb;margin:7px 0 0}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.form-grid label{display:flex;flex-direction:column;gap:6px;color:#aaa;font-size:12px}.form-grid label:last-child{grid-column:1/-1}.empty{padding:28px;text-align:center;color:var(--muted)}.task-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.task{padding:14px;border:1px solid var(--line);background:#1a1a28;border-radius:12px;margin-bottom:10px}.task b{display:block}.task>div{margin-top:12px;display:flex;gap:7px}.calendar-toolbar{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:20px}.calendar-toolbar h3{min-width:200px;text-align:center}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-head{text-align:center;color:#777487;font-size:11px;padding:7px}.cal-day{min-height:78px;background:#11111d;border:1px solid transparent;border-radius:10px;color:white;text-align:left;padding:9px;display:flex;flex-direction:column;gap:7px}.cal-day:hover,.cal-day.has{border-color:#8b5cf6;background:#19162b}.cal-day small{color:#c4b5fd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.report-grid,.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.report h3,.info-grid h3{margin-top:0}.report p,.info-grid p{color:var(--muted);min-height:40px}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:100;display:grid;place-items:center;padding:20px}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#171724;border:1px solid #38384d;border-radius:18px;padding:20px;box-shadow:0 30px 80px #000}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0;font-size:18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.profile-view{line-height:1.8;color:#ccc}.toast{position:fixed;right:22px;bottom:22px;z-index:200;padding:12px 16px;border-radius:10px;background:#202031;border:1px solid #444;color:white;box-shadow:0 10px 30px #000}.toast.ok{border-color:#10b981}.toast.bad{border-color:#ef4444}@media(max-width:1000px){#side{width:220px}#main{margin-left:220px}.grid.four{grid-template-columns:repeat(2,1fr)}.report-grid,.info-grid,.task-columns{grid-template-columns:1fr 1fr}}@media(max-width:720px){#side{transform:translateX(-100%);width:260px}#side.open{transform:translateX(0)}#main{margin-left:0}.search{display:none}.page{padding:18px}.banner,.page-head{align-items:flex-start;flex-direction:column}.grid.two,.grid.three,.grid.four,.report-grid,.info-grid,.task-columns{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid label:last-child{grid-column:auto}}
</style></head><body><div id="root"></div><script src="/assets/js/api.js"></script><script src="/assets/js/app.js"></script><script src="/assets/js/ux-patch.js"></script></body></html>
