server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index login.html;

    # Serve static files directly
    location / {
        try_files $uri $uri/ /login.html;
    }

    # Proxy API calls to the Spring Boot backend on Render.
    # Render's HTTPS endpoint requires SNI during the TLS handshake.
    location /api/ {
        proxy_pass         https://fms-backend.onrender.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name      fms-backend.onrender.com;
        proxy_set_header   Host              fms-backend.onrender.com;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
