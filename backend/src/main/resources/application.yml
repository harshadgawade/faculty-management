server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: faculty-management-system

  datasource:
    # Primary: explicit Spring datasource variables (works on Render and local VS Code runs).
    # Clever Cloud: MYSQL_ADDON_* variables are also supported as a fallback.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_ADDON_HOST:localhost}:${MYSQL_ADDON_PORT:3306}/${MYSQL_ADDON_DB:faculty_management_db}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_ADDON_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_ADDON_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 25

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@university.edu}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

rapidapi:
  key: ${RAPIDAPI_KEY:}
  host: platzi-reviews1.p.rapidapi.com
  url: https://platzi-reviews1.p.rapidapi.com/graphql

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  otp:
    expiry-seconds: 60
    length: 6
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,https://faculty-management-mojz.onrender.com}

logging:
  level:
    com.university.fms: DEBUG
    org.springframework.security: INFO
