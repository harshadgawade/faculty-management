server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: faculty-management-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/faculty_management_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update      # schema managed by schema.sql
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 25

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER:noreply@university.edu}
    password: ${MAIL_PASS:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ── RapidAPI Configuration ─────────────────────────────────────────
rapidapi:
  key: d8c09ef7aemshfa431790f80a5a3p13182ejsn311e968e7f97
  host: platzi-reviews1.p.rapidapi.com
  url: https://platzi-reviews1.p.rapidapi.com/graphql

# ── JWT & App Configuration ────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:7f3a9c2e1b4d6f8e0a2c4b6d8f1e3a5c7b9d0f2e4a6c8b0d2f4a6c8e0b2d4f6}
    expiration-ms: 86400000          # 24 hours
    refresh-expiration-ms: 604800000 # 7 days

  otp:
    expiry-seconds: 60
    length: 6

  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5500"

logging:
  level:
    com.university.fms: DEBUG
    org.springframework.security: INFO
