server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: faculty-management-system

  datasource:
    # Primary: explicit Spring datasource variables (works on Render and other hosts).
    # Clever Cloud: MYSQL_ADDON_* variables can be copied into the host running this app.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_ADDON_HOST:localhost}:${MYSQL_ADDON_PORT:3306}/${MYSQL_ADDON_DB:faculty_management_db}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_ADDON_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_ADDON_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 25

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER:noreply@university.edu}
    password: ${MAIL_PASS:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ── RapidAPI Configuration ─────────────────────────────────────────
rapidapi:
  key: ${RAPIDAPI_KEY:}
  host: platzi-reviews1.p.rapidapi.com
  url: https://platzi-reviews1.p.rapidapi.com/graphql

# ── JWT & App Configuration ────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  otp:
    expiry-seconds: 60
    length: 6

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,https://faculty-management-mojz.onrender.com}

logging:
  level:
    com.university.fms: DEBUG
    org.springframework.security: INFO
